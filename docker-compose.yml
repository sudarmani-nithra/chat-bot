services:
  ai-voice-assistant:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-voice-assistant:latest
    container_name: ai-voice-assistant
    restart: unless-stopped
    ports:
      - "${PORT:-8003}:${PORT:-8003}"
    env_file:
      - .env
    volumes:
      - ./audio_cache:/app/audio_cache
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${PORT:-8003}/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

