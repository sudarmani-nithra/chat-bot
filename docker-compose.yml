services:
  ai-voice-assistant:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-voice-assistant:latest
    container_name: ai-voice-assistant
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./audio_cache:/app/audio_cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

