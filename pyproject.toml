[project]
name = "ai-voice-assistant"
version = "1.0.0"
description = "Multilingual AI Voice Calling Assistant for Lead Conversion"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.9",
    "requests>=2.31.0",
    "google-genai>=1.0.0",
    "python-dotenv>=1.0.0",
    "pymysql>=1.1.0",
    "aiofiles>=23.2.1"
]

[tool.vercel]
entrypoint = "app:app"
